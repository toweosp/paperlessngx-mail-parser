[build-system]
requires = ["uv_build >= 0.10.0, <=0.11.32"]
build-backend = "uv_build"

[project]
name = "paperlessngx_mail_parser"
version = "v3.0.1"
authors = [
  { name="toweosp", email="dev@toweosp.org" },
]
description = "Alternative e-mail parser for Paperless-ngx"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-only"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/toweosp/paperlessngx-mail-parser"
Issues = "https://github.com/toweosp/paperlessngx-mail-parser/issues"

[project.entry-points."paperless_ngx.parsers"]
paperlessngx_mail_parser = "paperlessngx_mail_parser.parsers:MailDocumentParser"